title = "VilnaCRM website gitleaks config"

# Bundled default ruleset plus a narrow allowlist of what is genuinely
# non-secret (issue #353); a real credential added to any of these files later
# still fails the scan.
[extend]
useDefault = true

[allowlist]
description = "Generated / upstream-fetched artifacts and the single shared integration-test mock password. None are real credentials."
# Whole-file exemptions, all machine-generated/upstream-fetched so a human never
# pastes a credential into them:
#   - contracts/user-service/openapi.json    — fetched from the pinned contract
#   - contracts/user-service/checksums.json  — SHA-256 digests written only by
#     `make update-contracts` (#376); hand-editing is forbidden, and the 64-char
#     hex trips the generic high-entropy rule.
#   - public/swagger-schema.json             — generated build artifact
#   - config/ui-toolkit-checksums.json       — same digest shape/rule as above,
#     written only by `make update-ui-toolkit` (#488/#458); not yet on `main`
#     but caught by the history scan's walk of every fetched ref regardless.
#
# The rest are gitignored BUILD OUTPUT — never in a CI checkout, so exempting
# them can't hide a committed secret, but without them a developer's local
# `make lint-secrets` reports findings CI never sees, which is how a local gate
# stops being run. `tests/bats/secrets_scanning.bats` asserts each path is
# genuinely gitignored, so this stays true rather than merely documented:
#   - .next/ (build cache), out/ (static export), storybook-static-ci/ (Storybook build)
paths = [
  '''contracts/user-service/openapi\.json''',
  '''contracts/user-service/checksums\.json''',
  '''config/ui-toolkit-checksums\.json''',
  '''public/swagger-schema\.json''',
  # `/repo/` prefix is optional, not cosmetic: tree mode (`--no-git`) reports the
  # container-mount absolute path while the history scan reports repo-relative
  # paths — anchored so an unanchored `out/` doesn't also exempt `layout/`.
  '''^(/repo/)?\.next/''',
  '''^(/repo/)?out/''',
  '''^(/repo/)?storybook-static-ci/''',
  # The swagger contract's two paths before #376 vendored it — OpenAPI
  # `example:` values (a truncated JWT, sample hex secrets), history-scan-only
  # since neither path exists in the tree today; scoped exactly so a real
  # credential elsewhere still fails.
  '''^public/swagger-schema\.yaml$''',
  '''^src/features/swagger/components/ApiDocumentation/spec\.yaml$''',
]
# Only the shared integration-test mock password is exempted, not fixtures
# wholesale — a real secret added to those files is still caught.
regexes = [
  '''Integration123''',
]
