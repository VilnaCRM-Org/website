version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'monthly'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 2
    # Two groups over one ecosystem (issue #341). `applies-to` is a GROUP key —
    # it is not a supported key of an `updates` entry, so a "fourth block"
    # carrying it at entry level would be an unrecognised key on a duplicate
    # bun `/` entry, not a security stream. Splitting by group is the shape
    # GitHub actually honours, and it delivers what #341 wanted: an advisory is
    # raised as its own PR instead of being folded into the monthly grouped
    # version-update PR.
    #
    # `applies-to: version-updates` is spelled out rather than left to the
    # default, so neither group's scope is implicit.
    #
    # NOT YET ACTIVE: the security group stays inert until a maintainer enables
    # Dependabot security updates for this repository in
    # Settings -> Code security. Until that switch is on, GitHub never opens a
    # PR for it, so the "weekly security-update stream" acceptance criterion of
    # #341 is only half met from the repository side. Note also that security
    # updates are raised when an advisory matching the lockfile is detected, not
    # on `schedule.interval`, and they are exempt from
    # `open-pull-requests-limit`, which caps version updates only.
    groups:
      js-all-updates:
        applies-to: 'version-updates'
        patterns:
          - '*'
      js-security-updates:
        applies-to: 'security-updates'
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'deps'
      include: 'scope'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    groups:
      github-actions-all:
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'deps'
      include: 'scope'

  - package-ecosystem: 'docker'
    directories:
      - '/'
      - '/src/test/load'
    schedule:
      interval: 'weekly'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    groups:
      docker-all:
        patterns:
          - '*'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'deps'
      include: 'scope'
