name: dev container
description: >-
  Build (or restore from the BuildKit layer cache) the dev image and start the
  dev service idle, so a job can run the same in-container make targets a
  developer runs locally.

inputs:
  cache-write:
    description: >-
      Write layers back to the GitHub Actions cache. Only the default branch
      should do this: a cache written on a PR branch is readable by that PR
      alone, while one written on main is readable by every branch, and the
      repository shares a single 10 GB cache quota with the CodeQL and lychee
      entries.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    # The build below resolves the base image's manifest from ECR Public on every
    # run, even on a full layer-cache hit, and ECR Public's anonymous pull limit
    # is per source IP: when a push fans out into a dozen container-building jobs
    # at once, the shared runner pool answers 429 Too Many Requests and the build
    # dies in seconds (#505). A `uses:` step cannot be retried, so this waits,
    # with a growing back-off, until the registry serves that manifest again
    # before the build asks for it.
    - name: Wait for the base image registry
      shell: bash
      run: |
        set -euo pipefail
        base="$(sed -nE 's/^FROM[[:space:]]+([^[:space:]]+)[[:space:]]+AS[[:space:]]+base[[:space:]]*$/\1/p' Dockerfile | head -n1)"
        if [ -z "$base" ]; then
          echo "::error::could not read the base image from the Dockerfile's FROM … AS base line"
          exit 1
        fi
        for attempt in 1 2 3 4 5 6; do
          if docker manifest inspect "$base" > /dev/null 2>&1; then
            exit 0
          fi
          echo "::warning::the base image registry did not answer (attempt $attempt); backing off"
          sleep $((attempt * 30))
        done
        echo "::error::the base image registry kept refusing for six attempts"
        exit 1

    - name: Build or restore the dev image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        target: base
        # Must match `image:` on the dev service in docker-compose.yml — that is
        # what makes `docker compose up` reuse this build instead of running its
        # own, uncached one.
        tags: website-dev:latest
        load: true
        push: false
        # `load` exports into the classic image store, which cannot hold the
        # attestation manifests buildx attaches by default.
        provenance: false
        sbom: false
        # A stable scope, not one keyed on a hash of the build inputs: BuildKit
        # already invalidates per layer by content, so a PR that only touches
        # bun.lock still reuses the expensive apk/npm layer beneath it, whereas a
        # hash-keyed scope would miss the cache wholesale.
        cache-from: type=gha,scope=dev-image
        cache-to: ${{ inputs.cache-write == 'true' && 'type=gha,mode=max,scope=dev-image' || '' }}

    - name: Start the dev service
      shell: bash
      run: make ci-setup
