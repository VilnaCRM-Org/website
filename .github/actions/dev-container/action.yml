name: dev container
description: >-
  Build (or restore from the BuildKit layer cache) the dev image and start the
  dev service idle, so a job can run the same in-container make targets a
  developer runs locally.

inputs:
  cache-write:
    description: >-
      Write layers back to the GitHub Actions cache. Only the default branch
      should do this: a cache written on a PR branch is readable by that PR
      alone, while one written on main is readable by every branch, and the
      repository shares a single 10 GB cache quota with the CodeQL and lychee
      entries.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    # The build below resolves the base image's manifest from ECR Public on every
    # run, even on a full layer-cache hit, and ECR Public caps anonymous pulls per
    # source IP. GitHub's shared runner pool exhausts that cap and the registry
    # answers `429 toomanyrequests: Data limit exceeded` — a quota, not a burst,
    # so waiting it out does not work (#509, #506; the ten-minute back-off #505
    # added failed six attempts out of six). The Dockerfile pins the base by
    # digest, so the same bytes can come from any registry holding that digest:
    # this asks ECR Public once, prints the registry's own error text when it
    # refuses, and otherwise hands the build a named context that redirects the
    # FROM ref to the digest-identical mirror.gcr.io copy. The Dockerfile is not
    # touched and the digest is not dropped — the script refuses a base ref it
    # cannot derive a digest-pinned mirror for (ADR 0014).
    - name: Choose the base image source
      id: base-image
      shell: bash
      # The script appends ref, mirror, mirror-contexts, source and
      # build-contexts to $GITHUB_OUTPUT itself.
      run: bash ./scripts/ci/base-image-source.sh --probe Dockerfile

    - name: Build or restore the dev image
      id: build-image
      # A `uses:` step cannot be retried in place, and ECR Public can still refuse
      # the build's own manifest fetch after the probe above was answered. The
      # failure is tolerated here so the build can run once more below, from the
      # mirror; the second attempt is not tolerated.
      continue-on-error: true
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        target: base
        # Empty when ECR Public served the manifest; otherwise the named context
        # that fetches the same digest from mirror.gcr.io.
        build-contexts: ${{ steps.base-image.outputs.build-contexts }}
        # Must match `image:` on the dev service in docker-compose.yml — that is
        # what makes `docker compose up` reuse this build instead of running its
        # own, uncached one.
        tags: website-dev:latest
        load: true
        push: false
        # `load` exports into the classic image store, which cannot hold the
        # attestation manifests buildx attaches by default.
        provenance: false
        sbom: false
        # A stable scope, not one keyed on a hash of the build inputs: BuildKit
        # already invalidates per layer by content, so a PR that only touches
        # bun.lock still reuses the expensive apk/npm layer beneath it, whereas a
        # hash-keyed scope would miss the cache wholesale.
        cache-from: type=gha,scope=dev-image
        cache-to: ${{ inputs.cache-write == 'true' && 'type=gha,mode=max,scope=dev-image' || '' }}

    - name: Build or restore the dev image (second attempt)
      if: steps.build-image.outcome == 'failure'
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        target: base
        # Always the mirror: whatever refused the first attempt, the digest makes
        # this the same image, and ECR Public is the one registry already known
        # to be unreliable from this runner.
        build-contexts: ${{ steps.base-image.outputs.mirror-contexts }}
        # Must match `image:` on the dev service in docker-compose.yml — that is
        # what makes `docker compose up` reuse this build instead of running its
        # own, uncached one.
        tags: website-dev:latest
        load: true
        push: false
        # `load` exports into the classic image store, which cannot hold the
        # attestation manifests buildx attaches by default.
        provenance: false
        sbom: false
        # A stable scope, not one keyed on a hash of the build inputs: BuildKit
        # already invalidates per layer by content, so a PR that only touches
        # bun.lock still reuses the expensive apk/npm layer beneath it, whereas a
        # hash-keyed scope would miss the cache wholesale.
        cache-from: type=gha,scope=dev-image
        cache-to: ${{ inputs.cache-write == 'true' && 'type=gha,mode=max,scope=dev-image' || '' }}

    - name: Start the dev service
      shell: bash
      run: make ci-setup
