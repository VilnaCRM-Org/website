name: job log secrets alert

# Files the tracking issue for a job-log secret scan that did not pass (#375
# F4). It is the scan's only alerting path, and it is deliberately not
# ci-health-alerts.yml:
#
#   * That workflow closes its issue as soon as the latest run on main is green.
#     The scan runs after every privileged run, the pull-request sandbox pair
#     included, so the next unrelated clean scan would close a leaked-credential
#     alert within minutes. This one files an issue per scanned run and never
#     closes it.
#   * That workflow serializes every trigger on one concurrency group, and a
#     pending run there is replaced when a third one queues. Feeding it a run
#     after every pull-request scan could drop a queued alert, a scan finding
#     or somebody else's. Here every scan run gets a group of its own.
#
# It lives apart from job-log-secrets-scan.yml for a reason too: a workflow
# that grants `issues: write` and lists workflows under workflow_run counts as
# their alert coverage in assertion A of scripts/ci/lint-prod-guardrails.mjs.
# The scan lists the privileged workflows without alerting on their failures,
# so it must never grant that scope; this workflow lists only the scan.
#
# It runs the default branch's copy with its own token and reads nothing from
# the scanned run but ids and a conclusion, which the script validates.
on:
  workflow_run:
    workflows:
      - job log secrets scan
    types:
      - completed

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  alert:
    # Anything but a clean or skipped scan is filed: a cancelled or timed-out
    # scan has not read the logs either.
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'skipped' &&
      github.event.workflow_run.conclusion != 'neutral'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the alert script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/job-log-scan-alert.sh
          sparse-checkout-cone-mode: false

      - name: File or refresh the issue for the scanned run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SCAN_TITLE: ${{ github.event.workflow_run.display_title }}
          SCAN_RUN_ID: ${{ github.event.workflow_run.id }}
          SCAN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: bash scripts/ci/job-log-scan-alert.sh
