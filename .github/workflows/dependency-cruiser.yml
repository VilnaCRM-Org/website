name: dependency cruiser
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-cruiser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `make lint-deps` reaches the host-only `generate-localization` target, which
      # regenerates the gitignored pages/i18n/localization.json bundle. It imports
      # nothing outside node:fs/node:path, so this pins the Node version and
      # nothing else — no dependency cache and no package-manager install.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Start the dev container
        uses: ./.github/actions/dev-container

      - name: Validate architecture boundaries
        run: make lint-deps
