name: job log secrets scan

# Scans the job logs of every completed privileged run for leaked secrets
# (#375 F4). The tree and history legs in secrets-scanning.yml see only what is
# committed. A token these workflows fetch at run time -- the Secrets Manager
# GitHub token in the sandbox pair, the App token in the release -- is never a
# registered secret, so GitHub never masks it, and a debug flag, an erroring
# step or a compromised action that prints it would leave it readable in the
# run's log with nothing looking. This is the thing looking.
#
# It never checks out or executes the triggering run's code: workflow_run runs
# the default branch's copy of this file with its own token, and the logs are
# only downloaded and read as data. That is what makes it safe to follow the
# pull-request sandbox runs, a fork's included.
on:
  workflow_run:
    # Exact `name:` values of the privileged workflows: deploy.yml, autorelease.yml,
    # sandbox-creating.yml and sandbox-deleting.yml. Renaming one of them
    # silently stops its logs being scanned, so rename both in the same change;
    # tests/bats/secrets_scanning.bats fails on a name no workflow carries.
    workflows:
      - website
      - Generate Changelog and Create Release
      - sandbox
      - Trigger Sandbox Deletion
    types:
      - completed
  # Re-scan one run on demand, e.g. after a rule change or to prove the leg:
  #   gh workflow run job-log-secrets-scan.yml -f run_id=<id>
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Numeric id of the workflow run whose logs to scan'
        type: string
        required: true

permissions: {}

concurrency:
  # One group per scanned run, never cancelled: every privileged run's logs
  # must be read, and a newer run is not a reason to drop an older one's scan.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  scan:
    # A run whose every job was skipped wrote no logs, so there is nothing to
    # read and the download would fail on an absent archive.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # actions: read downloads the run's log archive; contents: read checks
      # out the scanner, its pinned image reference and the committed config.
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The run id reaches the script through env:, never ${{ }} in run:, and
      # the script validates it as a number before splicing it into the API
      # path. Any download failure fails this step, never skips the scan.
      - name: Download the run's job logs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          LOG_DIR: ${{ runner.temp }}/run-logs
        run: bash scripts/ci/fetch-run-logs.sh

      # A failure here is a finding (gitleaks prints it redacted). It reaches
      # the ci-alert tracking issue because `job log secrets scan` is listed in
      # ci-health-alerts.yml. Treat it as a live credential: rotate and revoke
      # it upstream, then delete the run's logs.
      - name: Scan the job logs for secrets
        env:
          LOG_DIR: ${{ runner.temp }}/run-logs
        run: make scan-secrets-logs LOG_DIR="$LOG_DIR"
