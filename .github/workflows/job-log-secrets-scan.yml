name: job log secrets scan

# Scans the job logs of every completed privileged run for leaked secrets
# (#375 F4). The tree and history legs in secrets-scanning.yml see only what is
# committed. A token these workflows fetch at run time -- the Secrets Manager
# GitHub token in the sandbox pair, the App token in the release -- is never a
# registered secret, so GitHub never masks it, and a debug flag, an erroring
# step or a compromised action that prints it would leave it readable in the
# run's log with nothing looking. This is the thing looking.
#
# It never checks out or executes the triggering run's code: workflow_run runs
# the default branch's copy of this file with its own token, and the logs are
# only downloaded and read as data. That is what makes it safe to follow the
# pull-request sandbox runs, a fork's included.

# Names what was scanned, so job-log-secrets-alert.yml can title its issue after
# the scanned run. That script parses exactly these two shapes.
run-name: >-
  ${{ github.event_name == 'schedule' && 'job log secrets scan - weekly backstop'
  || format('job log secrets scan - run {0}', github.event.workflow_run.id || inputs.run_id) }}

on:
  workflow_run:
    # Exact `name:` values of the privileged workflows: deploy.yml, autorelease.yml,
    # sandbox-creating.yml and sandbox-deleting.yml. Renaming one of them
    # silently stops its logs being scanned, so rename both in the same change;
    # tests/bats/secrets_scanning.bats fails on a name no workflow carries.
    workflows:
      - website
      - Generate Changelog and Create Release
      - sandbox
      - Trigger Sandbox Deletion
    types:
      - completed
  # The weekly backstop re-reads every completed run of the four workflows from
  # the last eight days (a day of overlap). A workflow_run delivery GitHub
  # dropped, or a per-run scan that died and was never re-dispatched, would
  # otherwise leave that run's logs unread for good.
  schedule:
    - cron: '30 4 * * 1'
  # Re-scan one run on demand, e.g. after a rule change or to prove the leg:
  #   gh workflow run job-log-secrets-scan.yml -f run_id=<id>
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Numeric id of the workflow run whose logs to scan'
        type: string
        required: true

permissions: {}

concurrency:
  # One group per scanned run, never cancelled: every privileged run's logs
  # must be read, and a newer run is not a reason to drop an older one's scan.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || inputs.run_id || 'backstop' }}
  cancel-in-progress: false

jobs:
  scan:
    # A run whose every job was skipped wrote no logs. That is only the cheap
    # half: a run cancelled while still pending ends `cancelled` with no job at
    # all, and fetch-run-logs.sh detects that from the run's jobs instead.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    # The weekly backstop downloads a week of archives (about a hundred runs).
    timeout-minutes: 30
    permissions:
      # actions: read downloads the run's log archive; contents: read checks
      # out the scanner, its pinned image reference and the committed config.
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The run id reaches the script through env:, never ${{ }} in run:, and
      # the script validates it as a number before splicing it into the API
      # path. Any download failure fails this step, never skips the scan. The
      # one exception is a run that never ran a job (cancelled while pending):
      # it wrote no logs, and the script reports logs=none. The backstop
      # fetches every run it can before failing on the ones it could not read,
      # so one deleted archive or one 5xx never leaves the rest of the week
      # unscanned. The backstop list is the file names of the four workflows
      # followed above; tests/bats/secrets_scanning.bats holds the two lists in
      # step.
      - name: Download the job logs
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          BACKSTOP_WORKFLOWS: >-
            ${{ github.event_name == 'schedule'
            && 'deploy.yml autorelease.yml sandbox-creating.yml sandbox-deleting.yml' || '' }}
          LOG_DIR: ${{ runner.temp }}/run-logs
        run: bash scripts/ci/fetch-run-logs.sh

      # Skipped only on an explicit logs=none: a missing output still scans,
      # and the scan then refuses the empty directory. It also runs after a
      # failed fetch that still extracted logs (logs=present -- the backstop
      # with some runs unreadable), so what could be read is read; the fetch
      # step keeps the job red. A failure here is a finding (gitleaks prints
      # it redacted) or an unreadable log directory; either way
      # job-log-secrets-alert.yml files an issue for this run that nothing
      # closes automatically. Treat a finding as a live credential: rotate and
      # revoke it upstream, then delete the run's logs.
      - name: Scan the job logs for secrets
        if: >-
          steps.fetch.outputs.logs != 'none' && !cancelled() &&
          (steps.fetch.outcome == 'success' || steps.fetch.outputs.logs == 'present')
        env:
          LOG_DIR: ${{ runner.temp }}/run-logs
        run: make scan-secrets-logs LOG_DIR="$LOG_DIR"
