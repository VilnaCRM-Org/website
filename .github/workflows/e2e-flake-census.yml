name: e2e flake census

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions: {}

# A census is a measurement, not a gate: never abort one mid-run for a newer trigger.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  census:
    # Advisory by design (#359). The blocking legs live in e2e-testing.yml and only cover the
    # specs a pull request changed; this run repeats the WHOLE suite off the PR path so the
    # pre-existing flake backlog is measured and tracked instead of silently absorbed by
    # `retries: 2`. Findings go to ONE `e2e-flake` tracker and the run stays green — a red
    # census would page somebody nightly for debt that is already known. A clean census closes
    # the tracker (#445). A census that measured nothing is the one red outcome: it is a
    # broken measurement, not debt, and must never read as clean. The tracker is the alert
    # surface, so this workflow is deliberately not in ci-health-alerts.yml, which would file
    # a second, differently-titled issue for the same run.
    name: nightly flake census
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Cache Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('.nvmrc') }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('.nvmrc') }}-

      - name: Setup Bun and install dependencies
        run: |
          npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
          bun install --frozen-lockfile

      - name: Repeat the whole e2e suite with retries off
        continue-on-error: true
        # Inside the job's 90: a hung burn-in must leave time for the tracker step to report
        # the census as unmeasured, instead of the job timeout cancelling it silently. Healthy
        # runs take 35-50 minutes.
        timeout-minutes: 75
        run: make test-e2e-burnin E2E_BURNIN_REPEATS=3

      - name: Summarise the flakes
        id: census
        run: |
          set -euo pipefail
          # -s so make does not echo the recipe into the captured Markdown. The verdict
          # (clean | findings | unmeasured) goes to its own file so the tracker step never
          # pattern-matches the prose.
          make -s check-e2e-flakes FLAKE_MODE=census FLAKE_REPORT_DIR=burn-in-results \
            FLAKE_CENSUS_VERDICT_FILE=census-verdict.txt | tee census.md
          cat census.md >> "$GITHUB_STEP_SUMMARY"

      - name: File, refresh or close the flake-tracking issue
        # Also after a failed summary: the script reads a missing verdict as `unmeasured`, so a
        # checker that crashed still reaches the tracker and still turns the run red.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # A dispatch from a branch measured that branch, not main: it reports what it would
          # do and writes nothing, so it can never close main's tracker.
          CENSUS_DRY_RUN: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
        run: bash scripts/ci/e2e-flake-census-issue.sh

      - name: Upload census report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-flake-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            burn-in-results/results.json
            census.md
            census-verdict.txt
          retention-days: 14
          if-no-files-found: ignore
