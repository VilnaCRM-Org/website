name: secrets scanning

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The working-tree leg: what this branch actually ships. Cheap, deterministic
  # and scoped to the diff's own risk, so it gates every PR.
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs the same target a developer runs locally, so the digest pin, the
      # committed .gitleaks.toml and the scan flags all have exactly one home
      # (the Makefile plus scripts/ci/scan-secrets.sh) rather than being
      # duplicated here and drifting.
      - name: Scan the working tree for secrets
        run: make lint-secrets

  # The history leg: every reachable commit. This is the one that catches a
  # credential that was committed and then "removed" in a later commit, where
  # the working tree is clean but the object store is not -- the gap the
  # working-tree scan structurally cannot see.
  #
  # It is deliberately NOT on the pull_request trigger. A finding in a 2024
  # commit is not the current author's regression, and blocking an unrelated PR
  # on it would only teach reviewers to click past a red check -- the same
  # reasoning that makes the dependency-CVE gate differential on PRs and
  # absolute on a schedule. A failure here reaches the ci-health tracking issue
  # instead, because `secrets scanning` is listed in ci-health-alerts.yml.
  history:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Required: on the default shallow clone gitleaks would scan only the
          # tip commit and pass vacuously. scan-secrets.sh refuses to run
          # without a .git directory, but it cannot tell a shallow clone from a
          # full one, so the depth is the real guarantee.
          fetch-depth: 0

      - name: Scan every reachable commit for secrets
        run: make scan-secrets-history
