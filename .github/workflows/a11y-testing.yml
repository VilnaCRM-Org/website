name: accessibility testing

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The accessibility gate is a check of its own, separate from `static testing`
  # (jsx-a11y lint) and `performance testing` (the Lighthouse accessibility
  # category score). Those two are heuristics; this one asserts WCAG 2.1 AA per
  # rule, per component and per route. See
  # docs/accessibility/acceptance-standard.md.
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Cache Bun cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('.nvmrc') }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ hashFiles('.nvmrc') }}-

      - name: Setup Bun and install dependencies
        # The component leg runs Jest on the runner, so it needs node_modules
        # here; the route leg runs Playwright inside the prod compose stack.
        run: |
          # Install the exact Bun pinned in package.json's packageManager field,
          # so the version is declared in exactly one place. Corepack does not
          # manage Bun, so it is installed globally via `npm install -g`.
          npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
          bun install --frozen-lockfile

      - name: Run accessibility gates
        run: make test-a11y

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: playwright-report-a11y-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 14
