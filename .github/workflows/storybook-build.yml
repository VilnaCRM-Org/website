name: storybook build

on:
  pull_request:
    branches:
      - main
    paths:
      - '.storybook/**'
      # Stories glob over the whole src tree (.storybook/main.ts:
      # '../src/**/*.stories.*' and '../src/**/*.mdx') and import the components
      # they render, so an ordinary source edit can break the Storybook build
      # without touching a story file. Watch the tree those stories import.
      - 'src/**'
      - '**/*.stories.*'
      - 'package.json'
      - 'bun.lock'
      # Direct inputs of the job below — a change to any of these can break the
      # build without touching a story, so they must re-trigger this check too.
      - 'Makefile'
      - 'scripts/generateLocalization.mjs'
      - '.nvmrc'
      # Since #399 the Storybook binary comes from the dev image, so anything
      # that builds or starts that container can break this job without touching
      # a story.
      - 'Dockerfile'
      - '.dockerignore'
      # COPYed into the `base` stage the dev service runs from, so editing
      # either rebuilds the image this job's Storybook binary comes from.
      # dev-image-cache.yml watches the same pair for the same reason.
      - 'checkNodeVersion.js'
      - 'scripts/*.mjs'
      # $(DEV_READY) runs `make ensure-dev`, which runs this guard on both sides
      # of `up` and exits non-zero on a foreign or bindless container — so it can
      # fail this job before Storybook is ever invoked.
      - 'scripts/ci/check-dev-container-bind.sh'
      - 'docker-compose.yml'
      # Tracked, and interpolated into docker-compose.yml (WEBSITE_DOMAIN,
      # DEV_PORT, ...), so editing it changes how the container is built and
      # started without touching any file above.
      - '.env'
      - 'docker-compose.ci.yml'
      - '.github/actions/dev-container/**'
      - 'next.config.js'
      - 'tsconfig.json'
      - '.github/workflows/storybook-build.yml'
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `make storybook-build` reaches the host-only `generate-localization` target, which
      # regenerates the gitignored pages/i18n/localization.json bundle. It imports
      # nothing outside node:fs/node:path, so this pins the Node version and
      # nothing else — no dependency cache and no package-manager install.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Start the dev container
        uses: ./.github/actions/dev-container

      # The gitignored pages/i18n/localization.json bundle (#328) no longer needs
      # its own step here: `make storybook-build` depends on the
      # `generate-localization` target, so the build produces it itself.
      - name: Build Storybook
        run: make storybook-build

      - name: Verify the Storybook output
        run: test -s storybook-static-ci/index.html
