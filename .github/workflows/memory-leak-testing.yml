name: memory leak testing

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  memory-leak-testing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ECR Public refuses anonymous pulls once GitHub's shared runners exhaust
      # its per-IP quota; this makes the image builds below fetch any refused
      # base from its digest-identical mirror.gcr.io copy instead (ADR 0014).
      ECR_MIRROR: probe
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Run memory leak testing
        run: make test-memory-leak
