name: website

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

permissions:
  id-token: write
  contents: read

# Serialize deploys per ref without cancelling: aborting an in-flight production
# CodePipeline trigger mid-run is unsafe, so a newer push queues behind the
# current one rather than superseding it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Gate the prod deploy behind a GitHub Environment so protection rules
    # (required reviewers / wait timer) can be enforced from repo Settings →
    # Environments → production. `url` surfaces the live site in the deployment
    # timeline once the PRODUCTION_SITE_URL repo variable is set.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_SITE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{vars.PROD_AWS_ACCOUNT_ID}}:role/website-deploy-trigger-role
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger CodePipeline
        run: |
          aws codepipeline start-pipeline-execution --name ci-cd-website-prod-pipeline

  post-deploy-smoke:
    name: post-deploy smoke test
    needs: deploy
    # The smoke test needs a public URL to probe. Until a maintainer sets the
    # PRODUCTION_SITE_URL repository variable (Settings → Secrets and variables →
    # Actions → Variables — see docs/deployment-runbook.md) the job skips cleanly
    # rather than failing the deploy workflow.
    if: ${{ vars.PRODUCTION_SITE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Smoke-test homepage and /swagger
        env:
          # CodePipeline deploys asynchronously, so the probe retries until the
          # CDN serves the new build (or the job times out).
          SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
        run: |
          set -euo pipefail

          base="${SITE_URL%/}"

          probe() {
            path="$1"
            label="$2"
            marker="$3"
            url="${base}${path}"
            attempts=24
            delay=15
            for i in $(seq 1 "$attempts"); do
              if body="$(curl -fsS --max-time 15 "$url")" \
                && printf '%s' "$body" | grep -Eiq "$marker"; then
                echo "✓ ${label} (${url}) returned 200 and matched /${marker}/i"
                return 0
              fi
              echo "… ${label} not ready (attempt ${i}/${attempts}); retrying in ${delay}s"
              sleep "$delay"
            done
            echo "::error::${label} (${url}) failed smoke test"
            return 1
          }

          # Probe both endpoints in parallel so each is fully tested within the
          # job timeout regardless of the other's outcome (they deploy together).
          probe "/" "homepage" "__next|<title" &
          home_pid=$!
          probe "/swagger" "swagger page" "swagger" &
          swagger_pid=$!

          rc=0
          wait "$home_pid" || rc=1
          wait "$swagger_pid" || rc=1
          exit "$rc"

      # Issue #377: the static export cannot honour Next `headers()`, so the CloudFront
      # edge functions are the only enforcement point. `make lint-headers` proves the
      # in-repo policy reaches every response the functions produce; this step proves the
      # deployed distribution actually associates them — on a real PAGE and a real ASSET,
      # not just the synthetic 404.
      - name: Verify security headers on a real page and an asset
        env:
          SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
        run: |
          set -euo pipefail

          base="${SITE_URL%/}"
          rc=0

          # Header names + expected values come from the single in-repo source of truth.
          policy="$(jq -r '.headers | to_entries[] | "\(.key)\t\(.value)"' config/security-headers.json)"

          check_path() {
            path="$1"
            label="$2"
            url="${base}${path}"
            if ! headers="$(curl -fsSI --max-time 15 "$url" | tr -d '\r')"; then
              echo "::error::${label} (${url}) — could not fetch response headers"
              rc=1
              return 0
            fi

            while IFS="$(printf '\t')" read -r name expected; do
              # `|| true`: a missing header makes grep exit 1, which under `set -e` +
              # `pipefail` would abort the step instead of reporting the gap.
              actual="$(printf '%s\n' "$headers" \
                | grep -i "^${name}:" \
                | head -n 1 \
                | cut -d: -f2- \
                | sed 's/^ *//' || true)"
              if [ "$actual" = "$expected" ]; then
                echo "✓ ${label}: ${name}: ${actual}"
              else
                echo "::error::${label} (${url}) — ${name}: expected '${expected}', got '${actual:-<missing>}'"
                rc=1
              fi
            done <<EOF
          $policy
          EOF
          }

          check_path "/" "homepage"
          check_path "/favicon.svg" "static asset"
          exit "$rc"
