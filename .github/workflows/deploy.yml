name: website

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

permissions: {}

# Serialize deploys per ref without cancelling: aborting an in-flight production
# CodePipeline trigger mid-run is unsafe, so a newer push queues behind the
# current one rather than superseding it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Only this job assumes the AWS deploy role, so `id-token: write` is
      # scoped to it rather than handed to every job in the workflow.
      id-token: write
      contents: read
    # Gate the prod deploy behind a GitHub Environment so protection rules
    # (required reviewers / wait timer) can be enforced from repo Settings →
    # Environments → production. `url` surfaces the live site in the deployment
    # timeline once the PRODUCTION_SITE_URL repo variable is set.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_SITE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: arn:aws:iam::${{vars.PROD_AWS_ACCOUNT_ID}}:role/website-deploy-trigger-role
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger CodePipeline
        run: |
          aws codepipeline start-pipeline-execution --name ci-cd-website-prod-pipeline

  post-deploy-smoke:
    name: post-deploy smoke test
    needs: deploy
    # The smoke test needs a public URL to probe. Until a maintainer sets the
    # PRODUCTION_SITE_URL repository variable (Settings → Secrets and variables →
    # Actions → Variables — see docs/deployment-runbook.md) the job skips cleanly
    # rather than failing the deploy workflow.
    if: ${{ vars.PRODUCTION_SITE_URL != '' }}
    runs-on: ubuntu-latest
    # Sized for the worst case, an origin that hangs rather than refuses: every
    # attempt can then spend its full 15s curl --max-time plus the 15s delay. The
    # header step's 2 x 12 attempts (~11.5 min), then smoke-prod's 12 negative
    # attempts and its advisory fetches (~6.5 min) and 2 x 24 positive ones
    # (~23.5 min, sequential since #329) come to ~42 min, so a hanging origin still
    # gets every verdict printed before the job is killed.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Issue #377: the static export cannot honour Next `headers()`, so the CloudFront
      # edge functions are the only enforcement point. `make lint-headers` proves the
      # in-repo policy reaches every response the functions produce; this step proves the
      # deployed distribution actually associates them — on a real PAGE and a real ASSET,
      # not just the synthetic 404.
      - name: Verify security headers on a real page and an asset
        env:
          SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
        run: |
          set -euo pipefail

          base="${SITE_URL%/}"
          rc=0

          # Header names + expected values come from the single in-repo source of truth.
          policy="$(jq -r '.headers | to_entries[] | "\(.key)\t\(.value)"' config/security-headers.json)"

          # CodePipeline (and any CloudFront function association) propagates
          # asynchronously, so each path is retried until the FULL policy is present
          # rather than failing on a single early miss.
          check_path() {
            path="$1"
            label="$2"
            url="${base}${path}"
            attempts=12
            delay=15

            for i in $(seq 1 "$attempts"); do
              gaps=''

              if headers="$(curl -fsSI --max-time 15 "$url" | tr -d '\r')"; then
                while IFS="$(printf '\t')" read -r name expected; do
                  # `|| true`: a missing header makes grep exit 1, which under `set -e` +
                  # `pipefail` would abort the step instead of reporting the gap.
                  actual="$(printf '%s\n' "$headers" \
                    | grep -i "^${name}:" \
                    | head -n 1 \
                    | cut -d: -f2- \
                    | sed 's/^ *//' || true)"
                  if [ "$actual" != "$expected" ]; then
                    gaps="${gaps}${name}: expected '${expected}', got '${actual:-<missing>}'; "
                  fi
                done <<EOF
          $policy
          EOF
              else
                gaps='could not fetch response headers; '
              fi

              if [ -z "$gaps" ]; then
                echo "✓ ${label} (${url}) carries the full security-header policy"
                return 0
              fi

              echo "… ${label} headers not ready (attempt ${i}/${attempts}): ${gaps}"
              if [ "$i" -lt "$attempts" ]; then
                sleep "$delay"
              fi
            done

            echo "::error::${label} (${url}) — ${gaps}"
            return 1
          }

          check_path "/" "homepage" || rc=1
          check_path "/favicon.svg" "static asset" || rc=1
          exit "$rc"

      # Issue #329: `make smoke-prod` is the whole post-deploy smoke — the negative
      # path (scripts/ci/smoke-response-shape.sh, issue #363) first, then the
      # homepage and /swagger (scripts/ci/uptime-check.sh, the scheduled uptime
      # check's own probe, given a deploy-sized retry budget). It used to probe the
      # 404 alone while the positive half lived inline in this job, so the
      # documented command could pass on a site whose homepage was down.
      #
      # The negative path is where every CloudFront production incident this
      # repository has had happened — 500 instead of 404 (#226, and again #229), a
      # 404 Safari downloaded for want of a content-type (#235), and a synthetic
      # response with no body that CloudFront turned into a 5xx (#249). The target
      # blocks on those shapes and on the branded edge document; the header advisory
      # inside the script warns, because that policy lives in the infra repository.
      #
      # After the #377 header step, with `!cancelled()`: a step failure stops the
      # job, and neither verdict may hide the other. The header check keeps its
      # established place, and a red header check still gets the homepage, /swagger
      # and 404 verdicts reported beside it.
      - name: Smoke-test the homepage, /swagger and the branded 404
        if: ${{ !cancelled() }}
        env:
          SITE_URL: ${{ vars.PRODUCTION_SITE_URL }}
        run: make smoke-prod SITE_URL="$SITE_URL"
