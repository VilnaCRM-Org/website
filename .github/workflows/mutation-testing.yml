name: mutation testing

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A pull-request run is superseded by the next push; the nightly census is a
  # measurement and must never be aborted mid-run for a newer trigger.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single source of truth for the shard count; keep each matrix index list
  # [0 .. TOTAL-1] in lock-step with it.
  MUTATION_SHARD_TOTAL: '2'

jobs:
  shard:
    name: shard ${{ matrix.index }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in lock-step with the MUTATION_SHARD_TOTAL env above:
        # index must be [0 .. TOTAL-1]. A mismatch fails closed at the merge
        # gate's shard-count/index check (and stryker.shard.config.mjs throws on
        # an out-of-range index).
        index: [0, 1]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `make test-mutation-shard` reaches the host-only `generate-localization` target, which
      # regenerates the gitignored pages/i18n/localization.json bundle. It imports
      # nothing outside node:fs/node:path, so this pins the Node version and
      # nothing else — no dependency cache and no package-manager install.
      # `make test-mutation-shard` reaches the host-only `generate-localization`
      # target, which regenerates the gitignored pages/i18n/localization.json
      # bundle. It imports nothing outside node:fs/node:path, so this pins the
      # Node version and nothing else — no dependency cache and no install.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Start the dev container
        uses: ./.github/actions/dev-container

      - name: Run mutation shard
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: make test-mutation-shard MUTATION_SHARD_INDEX="$SHARD_INDEX" MUTATION_SHARD_TOTAL="$MUTATION_SHARD_TOTAL"

      - name: Upload shard report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-shard-${{ matrix.index }}
          path: reports/mutation/mutation-shard-${{ matrix.index }}.json
          retention-days: 7
          if-no-files-found: error

  merge:
    name: merge and enforce gate
    needs: shard
    # Run even when a shard failed so the gate fails CLOSED. Without this the job
    # would be SKIPPED on shard failure, and branch protection treats a skipped
    # required check as passing — silently bypassing the mutation gate.
    if: ${{ github.event_name == 'pull_request' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Kept ahead of the container build: when a shard already failed there is
      # nothing to merge, and the gate should fail immediately rather than after
      # provisioning an image it will never use.
      - name: Fail if any mutation shard did not succeed
        if: needs.shard.result != 'success'
        env:
          SHARD_RESULT: ${{ needs.shard.result }}
        run: |
          echo "::error::Mutation shards did not all succeed (result=$SHARD_RESULT); failing the gate."
          exit 1

      - name: Start the dev container
        uses: ./.github/actions/dev-container

      - name: Download shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-shard-*
          path: reports/mutation
          merge-multiple: true

      - name: Merge reports and enforce mutation-score gate
        run: |
          set -euo pipefail
          make -s merge-mutation-reports MUTATION_SHARD_TOTAL="$MUTATION_SHARD_TOTAL"
          cat reports/mutation/summary.md >> "$GITHUB_STEP_SUMMARY"

  # BLOCKING leg (#345). The curated matrix above holds four hand-picked files at
  # 100%; everything else in src/ got zero mutation signal. This job mutates the
  # mutable files THIS pull request touches, so a weak new test is caught by the
  # author who wrote it. It gates at the changed-files threshold rather than
  # 100%: a file mutated for the first time is pre-existing debt, and blocking on
  # it would only teach reviewers to click past the check. A pull request that
  # touches no mutable file skips the run outright.
  changed:
    name: changed-files mutation gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The mutate list is a diff against the base branch, so that tip has to
          # be in the object store.
          fetch-depth: 0

      # `make test-mutation-shard` reaches the host-only `generate-localization`
      # target, which regenerates the gitignored pages/i18n/localization.json
      # bundle. It imports nothing outside node:fs/node:path, so this pins the
      # Node version and nothing else — no dependency cache and no install.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Start the dev container
        uses: ./.github/actions/dev-container

      - name: Mutate the files this pull request changes
        env:
          # `github.base_ref` is the branch name; the diff reads the
          # remote-tracking ref that `actions/checkout` fetched.
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          # pipefail is mandatory: GitHub's default shell is `bash -e`, so without
          # it the pipeline would exit with tee's status and the gate would fail
          # OPEN.
          set -euo pipefail
          make -s test-mutation-changed MUTATION_BASE_REF="$BASE_REF" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Append the per-file breakdown to the step summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f reports/mutation/summary.md ]; then
            cat reports/mutation/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

  # ADVISORY leg. The two pull-request legs above see only the curated four and
  # whatever a given pull request happens to touch; neither can see the mutation
  # debt sitting in files nobody edited. This one does, and records it in a single
  # refreshed tracking issue instead of reddening somebody's unrelated pull
  # request, closing that issue once a census finds nothing. It stays green by
  # design — a red nightly pages for debt no author caused — unless the census
  # measured nothing, which is a failed run rather than a finding.
  census:
    name: nightly mutation census
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # No `issues: write`: this job runs repository source through Stryker for up
    # to two hours. Every issue operation lives in `census-report`, which does no
    # code execution.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Keep in lock-step with MUTATION_SHARD_TOTAL, as for the curated matrix.
        index: [0, 1]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `make test-mutation-shard` reaches the host-only `generate-localization`
      # target, which regenerates the gitignored pages/i18n/localization.json
      # bundle. It imports nothing outside node:fs/node:path, so this pins the
      # Node version and nothing else — no dependency cache and no install.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Start the dev container
        uses: ./.github/actions/dev-container

      - name: Resolve the full mutate list
        run: make -s mutation-file-list MUTATION_SCOPE=full

      - name: Run census shard
        env:
          SHARD_INDEX: ${{ matrix.index }}
        run: |
          make test-mutation-shard MUTATION_SCOPE=full \
            MUTATION_SHARD_INDEX="$SHARD_INDEX" MUTATION_SHARD_TOTAL="$MUTATION_SHARD_TOTAL"

      - name: Upload census shard report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-census-shard-${{ matrix.index }}
          path: reports/mutation/mutation-shard-${{ matrix.index }}.json
          retention-days: 14
          if-no-files-found: error

  census-report:
    name: file, refresh or close the mutation-backlog issue
    needs: census
    if: ${{ github.event_name != 'pull_request' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fail if any census shard did not run
        # The census itself is advisory — a low score is the finding, not a
        # failure — but a shard that never produced a report means the census
        # measured nothing, and reporting a partial backlog as the whole backlog
        # would be worse than reporting none.
        if: needs.census.result != 'success'
        env:
          CENSUS_RESULT: ${{ needs.census.result }}
        run: |
          echo "::error::Mutation census shards did not all succeed (result=$CENSUS_RESULT)."
          exit 1

      - name: Start the dev container
        uses: ./.github/actions/dev-container

      - name: Download census shard reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-census-shard-*
          path: reports/mutation
          merge-multiple: true

      - name: Score the census
        run: |
          set -euo pipefail
          # The full scope is advisory in config/mutation-policy.json, so this
          # reports the backlog and exits 0. `mutation-file-list` re-resolves the
          # gate decision this job's checkout does not otherwise carry.
          make -s mutation-file-list MUTATION_SCOPE=full
          make -s merge-mutation-reports MUTATION_SCOPE=full MUTATION_SHARD_TOTAL="$MUTATION_SHARD_TOTAL"
          cat reports/mutation/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: File, refresh or close the mutation-backlog tracking issue
        # Also after a failed shard or merge: the script reads a missing verdict as
        # unmeasured, so a census that measured nothing still reaches the tracker and
        # still turns the run red. A clean census closes the tracker instead of
        # commenting on it (#513).
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # A dispatch from a branch measured that branch, not main: it reports what it would
          # do and writes nothing, so it can never close main's tracker.
          CENSUS_DRY_RUN: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
        run: bash scripts/ci/mutation-census-issue.sh

      - name: Upload census summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/mutation/summary.md
            reports/mutation/census-verdict.txt
            reports/mutation/mutate-list.txt
          retention-days: 14
          if-no-files-found: ignore
