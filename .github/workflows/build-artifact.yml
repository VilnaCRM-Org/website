name: build artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-artifact:
    # Not path-filtered: any change can break the production static export.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The validator shells out to `node scripts/ci/verify-edge-allowlist.mjs`,
      # which uses readdirSync({recursive:true}) string returns (Node >= 20.1).
      # Without this the gate would run on whatever Node the runner image happens
      # to ship, so a runner-image bump could break or silently weaken it.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Build the production static export
        run: make build-out

      - name: Validate the export
        run: bash scripts/ci/validate-build-artifact.sh out
