name: ci health alerts

on:
  workflow_run:
    workflows:
      - website
      - Generate Changelog and Create Release
      # CodeQL, so a scan that fails on main (a new blocking alert, or the
      # weekly re-scan finding one) reaches the same tracking issue (#383).
      - security testing
      # Since #399 these four run through the local ./.github/actions/dev-container
      # composite action, which lint-prod-guardrails treats as privileged (it
      # cannot see inside a composite, so it assumes the worst), and each also
      # runs on a non-pull-request trigger: `dev image cache` on push to main and
      # weekly, `fuzz testing` nightly, `storybook build` on a schedule, and
      # `mutation testing` nightly for the #345 census. Without an entry here a
      # post-merge failure of any of them would be visible to nobody -- exactly
      # the gap #365 exists to close.
      - dev image cache
      - fuzz testing
      - storybook build
      - mutation testing
      # The weekly full-history secret scan (#353). Its PR leg is the
      # working-tree scan and reports itself on the PR; the history leg runs
      # only on the Monday schedule and on workflow_dispatch, so without an
      # entry here a historical credential would be found by a job nobody
      # watches. Like `security testing` it also runs on pull_request, which the
      # branches filter below excludes.
      - secrets scanning
    types:
      - completed
    # `security testing` also runs on every pull request; without this filter
    # every PR run would dispatch this workflow and queue on its shared
    # concurrency group. workflow_run.branches filters on the branch the
    # TRIGGERING run executed on, and `website` / `Generate Changelog and Create
    # Release` both trigger only on push to main, so this is behaviour-neutral
    # for them. The step-level `event != 'pull_request'` guard below covers the
    # one case this filter cannot: a fork pull request whose head branch is
    # itself named `main`.
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'
  # Manual exercise path (issues #325, #329, #331). The inline logic this file
  # used to carry could only ever run post-merge, which is how it stayed broken
  # for its first ~100 runs -- every gh call died on a missing repository
  # context and no alert was ever filed. A dispatch defaults to a dry run, which
  # performs every read against the real API and writes nothing, so the fix (and
  # any later change) is proved from a branch before it merges:
  #   gh workflow run ci-health-alerts.yml --ref <branch> -f mode=sweep
  workflow_dispatch:
    inputs:
      mode:
        description: 'Alert path to exercise'
        type: choice
        options:
          - sweep
          - failure
          - recovery
        default: sweep
      workflow_name:
        description: 'Monitored workflow name for mode=failure|recovery (its `name:`, e.g. website)'
        type: string
        default: website
      dry_run:
        description: 'Report what would be filed, commented or closed instead of writing it'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Keyed on the ref; every automatic trigger here operates on main, so those
  # runs serialize on the shared ci-alert issue state (no duplicate/stale-close
  # races) without blocking unrelated refs, and a dry-run dispatch from a branch
  # gets a group of its own. cancel-in-progress is false so a queued alert run
  # is never dropped.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  alert:
    # Post-merge detection half of CI health (#365): even a perfect PR gate says
    # nothing once main, the deploy workflow, or the release workflow breaks and
    # nobody is told. This files/refreshes a labelled tracking issue on those
    # failures and on a red default branch, and closes it on recovery. It has no
    # pull_request trigger, so it never gates a PR.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      # commits/{ref}/check-runs (red-main sweep) needs Checks read; gh run list
      # (recovery confirmation) needs Actions read; code-scanning/alerts (the
      # finding digest attached to a failed security scan) needs Security-events
      # read.
      checks: read
      actions: read
      security-events: read
    env:
      GH_TOKEN: ${{ github.token }}
      # Repository context for EVERY gh call in the job. Without it the job's
      # first ~100 runs all died with `failed to run git: fatal: not a git
      # repository`: gh falls back to the git remote of the working directory
      # when neither --repo nor GH_REPO is given, and this job had no checkout.
      # The script re-exports it, and tests/bats/ci_health_alerts.bats proves
      # every gh invocation runs with it set.
      GH_REPO: ${{ github.repository }}
    steps:
      # The alert logic lives in a script rather than inline `run:` blocks so it
      # can be driven at PR time against a stubbed gh. Sparse checkout keeps this
      # to one file and persists no credentials. Unlike release-audit.yml there
      # is deliberately no `ref: main`: workflow_run and schedule already resolve
      # to the default branch, and a workflow_dispatch from a branch must run
      # THAT branch's script or the dry run proves nothing about the change under
      # review.
      - name: Check out the alert script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci/ci-health-alert.sh
          sparse-checkout-cone-mode: false

      # Every event value reaches the script through env:, never interpolated
      # with ${{ }} inside a run: block -- a workflow name is repository data,
      # but the discipline is the same one every other alerting workflow keeps.
      - name: Alert on a failed or timed-out monitored run
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event != 'pull_request' &&
          (github.event.workflow_run.conclusion == 'failure' ||
          github.event.workflow_run.conclusion == 'timed_out')
        env:
          ALERT_EVENT: failure
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: bash scripts/ci/ci-health-alert.sh

      - name: Close the alert when the workflow recovers
        if: >-
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event != 'pull_request' &&
          github.event.workflow_run.conclusion == 'success'
        env:
          ALERT_EVENT: recovery
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
        run: bash scripts/ci/ci-health-alert.sh

      - name: Sweep for a red default branch
        if: github.event_name == 'schedule'
        env:
          ALERT_EVENT: sweep
        run: bash scripts/ci/ci-health-alert.sh

      # Defaults to a dry run: every read hits the real API (so a broken token
      # or repository context still fails loudly) and nothing is written. Pass
      # dry_run=false only to file a real alert on purpose.
      - name: Manual alert run
        if: github.event_name == 'workflow_dispatch'
        env:
          ALERT_EVENT: ${{ inputs.mode }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash scripts/ci/ci-health-alert.sh
