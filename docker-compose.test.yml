services:
  prod:
    container_name: website-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - '3001:3001'
    shm_size: ${SHM_SIZE:-1g}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://${WEBSITE_DOMAIN}:${NEXT_PUBLIC_PROD_PORT}']
    networks:
      - website-network

  playwright:
    container_name: website-playwright
    build:
      context: .
      dockerfile: Playwright.Dockerfile
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - '9324:9324'
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://${NEXT_PUBLIC_PROD_HOST}:${NEXT_PUBLIC_PROD_PORT}
      # Playwright always runs inside this container, and `docker compose exec`
      # hands it none of the runner's environment — so `process.env.CI` was
      # undefined there and every CI-conditional in playwright.config.ts was
      # inert: `retries: 2` stayed 0, which meant `trace: 'on-first-retry'` could
      # never fire (the dead-config defect in #335), `workers: 1` never applied
      # despite the e2e workflow documenting it, and `forbidOnly` never guarded a
      # committed `.only`. GitHub Actions sets CI=true on the runner; locally the
      # Makefile's `CI ?= 0` is not exported, so this resolves to empty and the
      # local run keeps its parallel, retry-free behaviour.
      - CI=${CI:-}
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://${WEBSITE_DOMAIN}:${PLAYWRIGHT_TEST_PORT}']
    networks:
      - website-network

  apollo:
    container_name: website-apollo
    build:
      context: .
      dockerfile: Apollo.Dockerfile
    restart: unless-stopped
    ports:
      - '4000:4000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://${WEBSITE_DOMAIN}:${GRAPHQL_PORT}/${GRAPHQL_API_PATH}']
    networks:
      - website-network

  mockoon:
    container_name: website-mockoon
    build:
      # Hermetic: the image COPYs the committed contracts/user-service/openapi.json,
      # so there is no build arg and no network fetch. The pin still lives in .env,
      # consumed when the artifact is refreshed via `make update-contracts`.
      context: .
      dockerfile: Mockoon.Dockerfile
    ports:
      - '8080:8080'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://${WEBSITE_DOMAIN}:${MOCKOON_PORT}/api/users']
    networks:
      - website-network

  k6:
    container_name: website-k6
    profiles: ['load']
    build:
      context: .
      dockerfile: ./src/test/load/Dockerfile
    depends_on:
      prod:
        condition: service_healthy
    volumes:
      - ./src/test/load:/loadTests
    networks:
      - website-network

networks:
  website-network:
    external: true
    name: website-network
